<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="NOVA logo">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#ff3aa2" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.88"/>
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.26"/>
    </filter>

    <radialGradient id="glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.48"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect x="18" y="18" width="220" height="220" rx="64" fill="url(#bg)"/>
  <rect x="22" y="22" width="212" height="212" rx="60" fill="none" stroke="url(#shine)" stroke-width="2"/>

  <!-- Mark -->
  <g filter="url(#shadow)">
    <!-- soft inner glass */ -->
    <rect x="54" y="54" width="148" height="148" rx="54" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

    <!-- supernova burst (subtle, readable small) -->
    <g opacity="0.35" stroke="#ffffff" stroke-linecap="round">
      <path d="M128 62v20" stroke-width="8"/>
      <path d="M128 174v20" stroke-width="8"/>
      <path d="M62 128h20" stroke-width="8"/>
      <path d="M174 128h20" stroke-width="8"/>
      <path d="M82 82l14 14" stroke-width="7"/>
      <path d="M160 160l14 14" stroke-width="7"/>
      <path d="M174 82l-14 14" stroke-width="7"/>
      <path d="M96 160l-14 14" stroke-width="7"/>
    </g>

    <!-- orbit ring -->
    <circle cx="128" cy="128" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10"/>
    <path d="M178 108c-12-18-32-30-54-30" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round"/>

    <!-- monogram N -->
    <path d="M94 170V86L162 170V86" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- sparkle -->
    <path d="M190 70l5 15 15 5-15 5-5 15-5-15-15-5 15-5 5-15z" fill="#ffffff" fill-opacity="0.28"/>
  </g>
</svg>
