<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="NOVA mascot">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#ff3aa2" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.86"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="face" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0b1220" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.54"/>
    </radialGradient>

    <radialGradient id="eye" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.78"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.26"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.83  0 0 0 0 0.93  0 0 0 0.36 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer badge -->
  <rect x="16" y="16" width="224" height="224" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="60" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- Sparkle (small, readable at tiny sizes) -->
  <g filter="url(#glow)" opacity="0.95">
    <path d="M188 54l6 18 18 6-18 6-6 18-6-18-18-6 18-6 6-18z" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- Mascot: a friendly bot face inside a glassy pill -->
  <g filter="url(#softShadow)">
    <!-- antenna nub -->
    <path d="M128 54c0 10-4 18-10 26" fill="none" stroke="#ffffff" stroke-opacity="0.58" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="44" r="10" fill="#ffffff" fill-opacity="0.90"/>

    <!-- head shell -->
    <rect x="56" y="86" width="144" height="120" rx="44" fill="#0b1220" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

    <!-- face glass -->
    <rect x="72" y="104" width="112" height="78" rx="30" fill="url(#face)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M78 112c20-18 80-18 100 0" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" stroke-linecap="round"/>

    <!-- eyes (simple + cute) -->
    <circle cx="112" cy="143" r="10" fill="url(#eye)"/>
    <circle cx="144" cy="143" r="10" fill="url(#eye)"/>
    <circle cx="114" cy="146" r="4" fill="#0b1220" fill-opacity="0.52"/>
    <circle cx="146" cy="146" r="4" fill="#0b1220" fill-opacity="0.52"/>
    <circle cx="108" cy="139" r="3" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="140" cy="139" r="3" fill="#ffffff" fill-opacity="0.55"/>

    <!-- smile -->
    <path d="M112 165c9 8 23 8 32 0" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="6" stroke-linecap="round"/>

    <!-- cheeks -->
    <circle cx="94" cy="161" r="6" fill="#ff3aa2" fill-opacity="0.30"/>
    <circle cx="162" cy="161" r="6" fill="#22d3ee" fill-opacity="0.26"/>

    <!-- tiny body base -->
    <rect x="96" y="206" width="64" height="18" rx="9" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="110" cy="215" r="4" fill="#ffffff" fill-opacity="0.42"/>
    <circle cx="128" cy="215" r="4" fill="#ffffff" fill-opacity="0.42"/>
    <circle cx="146" cy="215" r="4" fill="#ffffff" fill-opacity="0.42"/>
  </g>
</svg>
