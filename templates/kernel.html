<!DOCTYPE html>
<html lang="en" data-theme-user="{{ me.id if me else '' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KERNEL</title>
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KERNEL" />
  <link rel="manifest" href="{{ url_for('manifest_webmanifest') }}" />
  <link rel="icon" href="{{ url_for('static', filename='brand/void-logo.png') }}" type="image/png" />
  <link rel="stylesheet" href="{{ url_for('static', filename='kernel_page.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='void_launch.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='app_switcher.css') }}" />
  <script defer src="{{ url_for('static', filename='theme.js') }}"></script>
  <script defer src="{{ url_for('static', filename='kernel_page.js') }}"></script>
</head>
<body class="kernel-body" data-void-launch-app="kernel" data-void-launch-target=".kernel-symbol">
  <div class="kernel-shell" id="kernelApp">
    <header class="kernel-top">
      <div class="kernel-brand">
        <div class="kernel-symbol" aria-hidden="true">
          <img class="kernel-symbol-img" src="{{ url_for('static', filename='brand/kernel-logo.svg') }}" alt="" />
        </div>
        <div class="kernel-brand-text">
          <div class="kernel-title">KERNEL</div>
          <div class="kernel-sub">Creator-grade control for your UI and layout.</div>
        </div>
      </div>
      <div class="kernel-top-actions">
        <a class="kernel-link" href="{{ url_for('chats') }}">Back to Chats</a>
      </div>
    </header>

    <div class="kernel-grid">
      <main class="kernel-main">
        <div class="kernel-mount" id="kernelMount" aria-live="polite"></div>
      </main>
      <aside class="kernel-side">
        <div class="kernel-card">
          <strong>Quick tips</strong>
          <ul class="kernel-list">
            <li>Pick Visual method to edit without code.</li>
            <li>Publish keys after saving changes in the editor.</li>
            <li>Use history to reveal past keys.</li>
          </ul>
        </div>
        <div class="kernel-card">
          <strong>Status</strong>
          <div class="kernel-status" id="kernelStatus">Checking kernel session...</div>
        </div>
      </aside>
    </div>
  </div>
  {% include "partials/app_switcher.html" %}
  <script defer src="{{ url_for('static', filename='void_launch.js') }}"></script>
  <script defer src="{{ url_for('static', filename='app_switcher.js') }}"></script>
</body>
</html>
