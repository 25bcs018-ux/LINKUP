<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .username {
            font-size: 18px;
            font-weight: 600;
        }

        .terminate-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .terminate-btn:hover {
            background: #ff3838;
        }

        .terminate-btn:active {
            transform: scale(0.98);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages-area::-webkit-scrollbar {
            width: 6px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .messages-area::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-content {
            margin-bottom: 6px;
        }

        .file-info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .message.user .file-info {
            border-top-color: rgba(255, 255, 255, 0.3);
        }

        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 12px 16px;
            background: #fafafa;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
        }

        .file-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            color: #667eea;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .file-btn:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        #fileInput {
            display: none;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        .message-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            transition: border-color 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .file-name {
            font-size: 12px;
            color: #999;
            padding: 6px 8px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-left: 4px;
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }

            .message-bubble {
                max-width: 85%;
            }

            .username {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="username"></div>
            <button class="terminate-btn" onclick="terminateChat()">Terminate</button>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="message bot">
                <div class="message-bubble">
                    <div class="message-content">Hello! How can I help you today?</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" onchange="handleFileSelect(event)">
                <button class="file-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">📎</button>
                <span class="file-name" id="fileName"></span>
            </div>

            <div class="message-input-wrapper">
                <textarea class="message-input" id="messageInput" placeholder="Type a message..." rows="1" onkeypress="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()" title="Send message">➤</button>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const messagesArea = document.getElementById('messagesArea');

            if (message === '' && !selectedFile) return;

            // Add user message
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'message user';
            
            let userBubbleHTML = `<div class="message-bubble"><div class="message-content">${escapeHtml(message)}</div>`;
            
            if (selectedFile) {
                userBubbleHTML += `<div class="file-info">📁 ${escapeHtml(selectedFile.name)} (${formatFileSize(selectedFile.size)})</div>`;
            }
            
            userBubbleHTML += '</div>';
            userMessageDiv.innerHTML = userBubbleHTML;
            messagesArea.appendChild(userMessageDiv);

            // Clear input
            input.value = '';
            selectedFile = null;
            document.getElementById('fileName').textContent = '';
            resetTextarea();

            // Scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;

            // Simulate bot response
            setTimeout(() => {
                const botMessageDiv = document.createElement('div');
                botMessageDiv.className = 'message bot';
                botMessageDiv.innerHTML = `<div class="message-bubble"><div class="message-content">That's interesting! I received your message${selectedFile ? ' with a file' : ''}.</div></div>`;
                messagesArea.appendChild(botMessageDiv);
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileName').textContent = file.name;
            }
        }

        function terminateChat() {
            if (confirm('Are you sure you want to terminate this chat?')) {
                alert('Chat terminated. Redirecting...');
                // In a real app, this would redirect or close the connection
                window.location.href = '/';
            }
        }

        function resetTextarea() {
            const textarea = document.getElementById('messageInput');
            textarea.style.height = 'auto';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
    </script>
</body>
</html>
